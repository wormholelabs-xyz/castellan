# The dev container and its egress firewall.
#
#   firewall      castellan, the DNS-driven egress firewall. It owns the network namespace that
#                 `dev` and `resolv-init` join, runs as an unprivileged user, and holds one
#                 capability: NET_ADMIN, for nft.
#   resolv-init   points the shared resolv.conf at castellan, once, as root with no capability.
#                 Docker's resolv.conf is root-owned, and this is the only thing here that needs
#                 root.
#   dev           the environment the agent works in. No capability, no sudo, and it starts only
#                 once the firewall is enforcing.
#
# The firewall is built from this repository's source (the `firewall` target of the Dockerfile).
# Rebuild the container to change it or its allow-list. The build arguments below are the pinned
# versions and checksums; fetch-vscode-extension-shas.sh and sync-claude-code-version.sh update
# them. check-sidecar.sh, run in CI, checks this file's security properties.

x-rust-args: &rust-args
  RUST_VERSION: "1.99.1"
  RUSTUP_VERSION: "1.29.2"
  RUSTUP_CHECKSUM_AMD64: "5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4"
  RUSTUP_CHECKSUM_ARM64: "a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697"

x-firewall-build: &firewall-build
  context: ..
  dockerfile: .devcontainer/Dockerfile
  target: firewall
  args:
    <<: *rust-args

services:
  firewall:
    build: *firewall-build
    # Not root: the image's USER says the same. castellan needs no root and no capability but
    # NET_ADMIN, which it and nft get from file capabilities (`setcap` in the Dockerfile): Docker
    # gives a non-root user the bounding set, not an effective one. So no `no-new-privileges`
    # here, which would ignore them.
    user: castellan
    init: true
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN    # `nft`: install and update the ruleset in the shared network namespace
    # castellan checks route_localnet (the DNS redirect goes to loopback) but cannot set it, and
    # binds 127.0.0.1:53 as an ordinary user. Docker only lets the namespace's owner set either.
    sysctls:
      net.ipv4.conf.all.route_localnet: "1"
      net.ipv4.ip_unprivileged_port_start: "0"
    # Healthy once the daemon has bound its socket, installed the ruleset and started serving: it
    # writes this file last, and the supervisor removes it whenever the daemon exits.
    healthcheck:
      test: ["CMD", "test", "-f", "/run/castellan/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    # No restart policy: a restarted container gets a new network namespace and `dev` would be
    # left in the old one. Dev Containers starts and stops the whole set together, and the
    # supervisor restarts a daemon that crashes without the container restarting.

  resolv-init:
    build: *firewall-build
    user: "0:0"
    cap_drop: [ALL]
    # The firewall's namespace, and so the firewall's resolv.conf: Docker gives a container that
    # joins another's network namespace the other's file. Root owns it, so root with no
    # capability may write it.
    network_mode: "service:firewall"
    entrypoint: ["/bin/sh", "-c", "echo 'nameserver 127.0.0.1' > /etc/resolv.conf"]
    restart: "no"
    depends_on:
      firewall:
        condition: service_healthy
        restart: true

  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        TZ: ${TZ:-America/Los_Angeles}
        <<: *rust-args
        CLAUDE_CODE_VERSION: "2.1.299"
        CLAUDE_CODE_CHECKSUM_AMD64: "2d894a4b1bfaaa9aab72aeff7803e3c73bc2510f279a171f6b8f59f72d17d077"
        CLAUDE_CODE_CHECKSUM_ARM64: "4cd5ab006b49dc12a247fed4dbc42a925ad1aea1e711d9aa24587d285ee87c2f"
        GIT_DELTA_VERSION: "0.18.2"
        GIT_DELTA_CHECKSUM_AMD64: "1658c7b61825d411b50734f34016101309e4b6e7f5799944cf8e4ac542cebd7f"
        GIT_DELTA_CHECKSUM_ARM64: "937781aa7788e1510858743fff6c9a8b4a69fe0a22a7c8a69493e633227939a9"
        OHMYZSH_COMMIT: "c954bbb168fc645592c50017de0d0e138db8df5f"
        POWERLEVEL10K_COMMIT: "35833ea15f14b71dbcebc7e54c104d8d56ca5268"
        CLAUDE_CODE_EXT_VERSION: "2.1.299"
        CLAUDE_CODE_EXT_SHA256: "amd64=c4776f521668113527622a689e6f03ce2a677791eef39787996f7a9316c343d4,arm64=a0c4963d8d8d1f6edfca0efcd10be19d69feb8f3f4bdfaea690ae0959077eed2"
        RUST_ANALYZER_EXT_VERSION: "0.3.3081"
        RUST_ANALYZER_EXT_SHA256: "amd64=fd547d4a2df8b449537b1a3896a18c11a353f0ec449ac53471551ca069723bc2,arm64=8a7bab5cbf58437c2c2ae4c4856f4647072edf15c2dd89a49345b37c92cbe91f"
        EVEN_BETTER_TOML_EXT_VERSION: "0.21.2"
        EVEN_BETTER_TOML_EXT_SHA256: "21b8d66af4285eee31e21a4492f921ab36dffcd859a67f1115d2930274650808"
        CODELLDB_EXT_VERSION: "1.12.3"
        CODELLDB_EXT_SHA256: "460ac959094344ebb29b3d01bad94f6093b374d6fff44896ca456ac5b2047cd1"
        DEPENDI_EXT_VERSION: "1.20.0"
        DEPENDI_EXT_SHA256: "5d507ac2c8ef42f60dcfc7f29a650864a426a6bc2a0dff5a42c9238c57b6a809"
        GITLENS_EXT_VERSION: "19.3.0"
        GITLENS_EXT_SHA256: "8ee8f6a5fa49435f27059a6c65a4b05e5228ba490f1f704d4cf6e257413f6fcb"
    # Dev Containers does not override the command for a compose config, and the image has none.
    command: ["sleep", "infinity"]
    init: true
    # No capabilities, and no way to gain one: nothing here can touch the firewall's ruleset or
    # become root. check-sidecar.sh checks these lines.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: "service:firewall"
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
      CLAUDE_CONFIG_DIR: /home/node/.claude
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ..:/workspace:cached
      - claude-config:/home/node/.claude
      - bash-history:/commandhistory
      - /dev/null:/workspace/.env.development
      - /dev/null:/workspace/.env
    depends_on:
      firewall:
        condition: service_healthy
        restart: true      # if the firewall is recreated, its network namespace is a different one
      resolv-init:
        condition: service_completed_successfully
        restart: true

volumes:
  claude-config:
  bash-history:
